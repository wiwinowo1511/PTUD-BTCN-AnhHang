<!DOCTYPE html>
<html>

<head>
    <title>Tạo responsive</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,

initial-scale=1.0">
    <style>
        .left,
        .right {
            height: 400px;
        }

        .left {
            background: blue;
            float: left;
            width: 70%;
        }

        .right {
            background: red;
            float: right;
            width: 30%;
        }

        @media only screen and (max-width: 768px) {

            .left,
            .right,
            #sidebar {
                width: 100%
            }
        }


        @media only screen and (min-width: 769px) {
            #sidebar {
                width: 100px
            }

        }


        /* Nếu chiều rộng của trình duyệt từ 320px
đến 480px thì ẩn class Right */

        @media only screen and (min-width: 320px) and (max-width: 480px) {
            .right {
                display: none;
            }
        }

        /* Nếu ở chế độ máy in thì ẩn class Left */
        @media print {
            .left {
                display: none;
            }

            .right {
                width: 100%;
            }
        }

       
    </style>
</head>
<body>


   

    <div class="container">
        <div class="left">LEFT
            <picture>
    <source
        media="(min-width: 960px)"
        srcset="https://ueh.edu.vn/images/logo-header.png">

    <source
        media="(min-width: 480px)"
        srcset="https://ctd.ueh.edu.vn/wp-content/uploads/2023/07/cropped-TV_trang_CTD.png">

    <img
        src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png"
     alt="BIT Header Logo">
</picture>
        </div>
        <div class="right">RIGHT</div>
    </div>
</body>

</html>
