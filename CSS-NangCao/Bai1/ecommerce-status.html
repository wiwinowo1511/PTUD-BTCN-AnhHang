<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đơn hàng của tôi - Thạch Anh Xinh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <div class="row">
      <div class="col-sm-4 col-md-3" id="side"></div>
      <div class="col-sm-8 col-md-9" id="main"></div>
    </div>
  </div>
  <div id="foot"></div>

  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script src="app.js"></script>
  <script>
    /* [mã sản phẩm, số lượng, trạng thái, số tin nhắn] */
    var O = [[1, 1, "track", 1], [3, 2, "done", 1], [4, 1, "cancel", 0], [5, 1, "track", 1], [7, 1, "done", 1], [2, 1, "track", 1]];
    var ST = {
      track:  '<button class="btn btn-sm btn-default" onclick="toast(\'Đơn hàng đang được giao\')">Theo dõi</button>',
      done:   '<button class="btn btn-sm btn-success">Hoàn thành</button>',
      cancel: '<button class="btn btn-sm btn-danger">Đã hủy</button>'
    };
    $(function () {
      layout(sideOrders());
      var html = '<h3>Trạng thái đơn hàng</h3>';
      O.forEach(function (o) {
        var p = P[o[0] - 1];
        html += '<div class="thumbnail order"><div class="row">' +
          '<div class="col-sm-1"><img class="img-responsive" src="' + p.image + '" alt="' + p.name + '"></div>' +
          '<div class="col-sm-4"><a href="ecommerce-detail.html?id=' + p.id + '">' + p.name + '</a></div>' +
          '<div class="col-sm-1">' + o[1] + '</div>' +
          '<div class="col-sm-2">' + money(p.price * o[1]) + '</div>' +
          '<div class="col-sm-2">' + ST[o[2]] + '</div>' +
          '<div class="col-sm-2"><a href="#">' + o[3] + ' tin nhắn</a></div></div></div>';
      });
      $("#main").html(html);
    });
  </script>
</body>
</html>
