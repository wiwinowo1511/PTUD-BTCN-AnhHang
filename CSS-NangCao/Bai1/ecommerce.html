<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thạch Anh Xinh - Vòng tay đá thạch anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kartik-v/bootstrap-star-rating@4.1.2/css/star-rating.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kartik-v/bootstrap-star-rating@4.1.2/themes/krajee-svg/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <div class="row">
      <div class="col-sm-4 col-md-3" id="side"></div>
      <div class="col-sm-8 col-md-9" id="main"></div>
    </div>
  </div>
  <div id="foot"></div>

  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/kartik-v/bootstrap-star-rating@4.1.2/js/star-rating.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/kartik-v/bootstrap-star-rating@4.1.2/themes/krajee-svg/theme.js"></script>
  <script src="app.js"></script>
  <script>
    $(function () {
      var q = (param("q") || "").toLowerCase(), cat = param("cat");
      if (!CATS[cat]) cat = null;
      layout(sideCats(cat));

      var list = P.filter(function (p) {
        return (cat === null || p.cat == cat) && p.name.toLowerCase().indexOf(q) > -1;
      });
      var title = q ? 'Kết quả cho "' + esc(q) + '"' : (cat !== null ? CATS[cat] : "Sản phẩm nổi bật");

      var html = "";
      if (!q && cat === null) {
        html += '<div id="carousel-example-generic" class="carousel slide" data-ride="carousel">' +
          '<ol class="carousel-indicators"><li data-target="#carousel-example-generic" data-slide-to="0" class="active"></li>' +
          '<li data-target="#carousel-example-generic" data-slide-to="1"></li><li data-target="#carousel-example-generic" data-slide-to="2"></li></ol>' +
          '<div class="carousel-inner" role="listbox">' +
          [
            { product: P[0], tone: "lilac", label: "BỘ SƯU TẬP THẠCH ANH", title: "Tỏa sáng với sắc tím tự nhiên", text: "Vòng thạch anh tím dịu dàng, điểm nhấn tinh tế cho phong cách mỗi ngày.", link: "ecommerce.html?cat=0", action: "Xem thạch anh tím" },
            { product: P[2], tone: "rose", label: "MÓN QUÀ TỪ TRÁI TIM", title: "Trao món quà dịu dàng", text: "Thạch anh hồng ngọt ngào, gửi gắm lời yêu thương đến người bạn quý mến.", link: "ecommerce.html?cat=1", action: "Khám phá thạch anh hồng" },
            { product: P[6], tone: "gold", label: "SẮC ĐÁ MAY MẮN", title: "Rạng rỡ cùng sắc vàng", text: "Citrine ấm áp, tô điểm vẻ tươi sáng và nổi bật cho riêng bạn.", link: "ecommerce.html?cat=5", action: "Xem thạch anh vàng" }
          ].map(function (slide, i) {
            return '<div class="item' + (i ? '' : ' active') + '"><div class="store-banner store-banner-' + slide.tone + '">' +
              '<div class="store-banner-copy"><span class="store-banner-label">' + slide.label + '</span><h2>' + slide.title + '</h2><p>' + slide.text + '</p>' +
              '<a class="store-banner-action" href="' + slide.link + '">' + slide.action + '<span class="glyphicon glyphicon-arrow-right" aria-hidden="true"></span></a></div>' +
              '<div class="store-banner-image"><img src="' + slide.product.image + '" alt="' + slide.product.name + '"></div></div></div>';
          }).join("") +
          '</div><a class="left carousel-control" href="#carousel-example-generic" role="button" data-slide="prev"><span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span><span class="sr-only">Previous</span></a>' +
          '<a class="right carousel-control" href="#carousel-example-generic" role="button" data-slide="next"><span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span><span class="sr-only">Next</span></a></div>';
      }
      html += '<h3>' + title + '</h3><div class="row">' +
        (list.length ? list.map(card).join("") : '<div class="col-xs-12"><p>Không tìm thấy sản phẩm phù hợp.</p></div>') + '</div>';
      $("#main").html(html);
      initRatings($("#main"));
      $('[data-toggle="tooltip"]').tooltip();
    });
  </script>
</body>
</html>
