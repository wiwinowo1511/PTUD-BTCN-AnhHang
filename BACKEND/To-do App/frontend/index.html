<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Lumi - Hôm nay</title>
</head>

<body data-page="dashboard">
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <header class="hero">
        <div>
          <p class="date" id="today-date"></p>
          <h1 id="greeting">Xin chào</h1>
        </div>
        <button class="btn primary" id="btn-add">Thêm task</button>
      </header>
      <section class="summary" aria-live="polite">
        <div class="card progress-card">
          <div class="ph"><span>Tiến độ hôm nay</span><strong id="pct">0%</strong></div>
          <div class="bar"><i id="bar-fill"></i></div><small id="pct-note">Đang tải...</small>
        </div>
        <div class="stat"><span>Tổng task</span><b id="s-total">–</b></div>
        <div class="stat done"><span>Hoàn thành</span><b id="s-completed">–</b></div>
        <div class="stat doing"><span>Đang thực hiện</span><b id="s-inProgress">–</b></div>
        <div class="stat todo"><span>Chưa bắt đầu</span><b id="s-todo">–</b></div>
        <div class="stat late"><span>Quá hạn</span><b id="s-overdue">–</b></div>
      </section>
      <div id="toolbar"></div>
      <div id="task-list" class="task-list"></div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>

</html>
